{% extends 'base.html' %}{% block content %}<span class="eyebrow">ADMINISTRACIÓN</span><h1>Gestión de usuarios</h1><section class="card"><div class="tablewrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Permisos</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{% if u.id != user.id %}<form class="actions" method="post" action="{{url_for('admin_role',user_id=u.id)}}"><select name="role"><option value="agricultor" {% if u.role=='agricultor' %}selected{% endif %}>Agricultor</option><option value="admin" {% if u.role=='admin' %}selected{% endif %}>Administrador</option></select><button class="btn small">Actualizar</button></form>{% else %}Cuenta actual{% endif %}</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
