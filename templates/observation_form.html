{% extends 'base.html' %}{% block content %}<section class="card formcard"><h1>Editar observación</h1><p>{{plot.name}}</p><form method="post" class="form"><label>Fecha<input type="date" name="date" value="{{obs.date}}" required></label><label>Temperatura °C<input type="number" name="temperature" step="0.1" min="-90" max="70" value="{{obs.temperature}}" required></label><label>Precipitación mm<input type="number" name="rainfall" step="0.1" min="0" max="2000" value="{{obs.rainfall}}" required></label><label>Humedad del suelo % (0 para registros NASA sin dato)<input type="number" name="soil_moisture" step="0.1" min="0" max="100" value="{{obs.soil_moisture}}" required></label><button class="btn">Guardar cambios</button></form></section>{% endblock %}
