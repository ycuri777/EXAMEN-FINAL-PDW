{% extends 'base.html' %}{% block content %}<section class="card formcard"><span class="eyebrow">GESTIÓN AGRÍCOLA</span><h1>{{'Editar parcela' if plot else 'Registrar parcela'}}</h1><form method="post" class="form"><label>Nombre de la parcela<input name="name" required value="{{plot.name if plot else ''}}" placeholder="Parcela Los Olivos"></label><label>Ubicación<input name="location" required value="{{plot.location if plot else ''}}" placeholder="Lima, Perú"></label><label>Cultivo<input name="crop" required value="{{plot.crop if plot else ''}}" placeholder="Maíz"></label><label>Superficie (hectáreas)<input type="number" min="0.01" step="0.01" name="area" required value="{{plot.area if plot else ''}}"></label><div class="twocol"><label>Latitud (opcional)<input type="number" min="-90" max="90" step="any" name="latitude" value="{{plot.latitude if plot and plot.latitude is not none else ''}}"></label><label>Longitud (opcional)<input type="number" min="-180" max="180" step="any" name="longitude" value="{{plot.longitude if plot and plot.longitude is not none else ''}}"></label></div><button class="btn">Guardar parcela</button></form></section>{% endblock %}
